[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiergraph"
dynamic = ["version"]
description = "Ordered tiers, declared relations, and an algebra over them"
readme = "README.md"
authors = [{name = "Kevin Lenzo"}]
license = "BSD-2-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Split so each CI job installs only what it needs.
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
lint = ["ruff>=0.16", "mypy>=1.11"]
# Development only, never a runtime dependency: pydantic's core is compiled, and
# the shipped package stays pure Python.
dev = ["tiergraph[test,lint]", "pydantic>=2.9"]

[project.scripts]
tiergraph = "tiergraph.cli:main"

[project.urls]
Homepage = "https://github.com/lenzo-ka/tiergraph"
Repository = "https://github.com/lenzo-ka/tiergraph"

[tool.hatch.version]
path = "src/tiergraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tiergraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["tiergraph"]

[tool.coverage.report]
# Ratchets upward, never down.
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

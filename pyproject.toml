[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tiergraph"
dynamic = ["version"]
description = "Ordered tiers, declared relations, and an algebra over them"
readme = "README.md"
authors = [{name = "Kevin Lenzo"}]
license = "BSD-2-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Split so each CI job installs only what it needs.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.26",
    # The build backend, which pip otherwise resolves only into an isolated
    # build environment. The suite builds the source distribution to check that
    # the publishability gate reads every file that ships; what a build includes
    # is not inferable from the sources. Naming it here also lets a wheel be
    # built and inspected by hand without a network fetch, which matters because
    # this distribution ships two import packages.
    "hatchling>=1.27",
]
lint = ["ruff>=0.16", "mypy>=1.11"]
# Development only, never a runtime dependency: pydantic's core is compiled, and
# the shipped package stays pure Python.
dev = ["tiergraph[test,lint]", "pydantic>=2.9"]

[project.scripts]
tiergraph = "tiergraph.cli:main"

[project.urls]
Homepage = "https://github.com/lenzo-ka/tiergraph"
Repository = "https://github.com/lenzo-ka/tiergraph"

[tool.hatch.version]
path = "src/tiergraph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tiergraph", "src/tiergraph_dot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
# The gate scripts are held to the same bar as the shipped packages: a check
# nobody exercises is a check nobody can trust.
source = ["tiergraph", "tiergraph_dot", "scripts"]

[tool.coverage.report]
# Ratchets upward, never down.
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "PLR2004", "PERF401", "SIM102", "SIM105", "SIM114", "SIM115",
    "RUF007", "RUF022", "RUF100",
    "ARG001", "ARG002", "ARG005",
    "C420", "PLW2901", "PLC0415", "PLW1510",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    # A literal in an assertion is the assertion; naming it hides what the test checks.
    "PLR2004",
    # Unused stub parameters document the callback's shape rather than being dead.
    "ARG001",
    # Unused lambda parameters document the callback's shape rather than being dead.
    "ARG005",
]
"examples/**/*.py" = [
    # A literal in an assertion is the assertion; naming it hides what the example checks.
    "PLR2004",
    # Unused stub parameters document the callback's shape rather than being dead.
    "ARG001",
    # Unused lambda parameters document the callback's shape rather than being dead.
    "ARG005",
]

[tool.mypy]
python_version = "3.12"
strict = true
# The gate scripts are inside every other bar this project keeps -- lint,
# format, coverage, docstrings -- so they are inside this one too.
files = ["src", "tests", "examples", "scripts"]

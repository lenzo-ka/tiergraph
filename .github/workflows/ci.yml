name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action below is pinned to a commit, with the release it was resolved
# from in the comment beside it, for the reasons written out at the top of
# publish.yml. The two workflows had drifted apart on `actions/checkout` and
# `actions/setup-python`; pinning settles both on one revision, and the
# publishability gate now refuses an unallowlisted or unpinned reference in
# either file, so they cannot drift again unremarked.
jobs:
  test-python-313:
    name: test (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      # Full history is fetched because the format-growth gate recovers its
      # baseline from the newest release tag in the current line. Without a tag
      # it refuses rather than passing, which is the intended failure but not a
      # useful one to meet in CI on every run. `fetch-tags` is not enough: the
      # default checkout fetches one commit by SHA, and a tag pointing outside
      # that single commit does not come with it. Measured, not assumed -- the
      # gate refused on this workflow's first run with `fetch-tags: true` set.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Only run the 3.13 compatibility suite when code changes; a docs- or
      # metadata-only change cannot affect it, and the job still reports success
      # so a required check does not hang.
      #
      # The workflow directory is named as a directory rather than by file. The
      # list said `ci.yml` and meant "a workflow changed", so `publish.yml` was
      # outside every filter in this repository and a change to it ran nothing.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - '.github/workflows/**'
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: steps.changes.outputs.code == 'true'
        run: python -m pip install --upgrade pip
      - if: steps.changes.outputs.code == 'true'
        run: python -m pip install -e ".[test]"
      # The documentation gate type-checks doc code fences with mypy (a dev-tooling
      # concern pinned to the 3.12 environment) and is covered by the full make check job.
      - if: steps.changes.outputs.code == 'true'
        run: python -m pytest --deselect tests/test_docs.py::test_documentation_gate_is_current
      - if: steps.changes.outputs.code != 'true'
        run: echo "No code changed; skipping the 3.13 compatibility suite."

  check:
    runs-on: ubuntu-latest
    steps:
      # See the note on the job above: the format-growth gate needs the release
      # tags to have a baseline to compare against.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The publishability gate reads every tracked file, and every tracked file
      # ships, so no change to this repository is inert to it. It runs before the
      # path filter and outside it: a green check that ran nothing reads as
      # verification without being any, and a filter list naming the files it
      # covers is exactly the hand-kept list this gate stopped trusting. It needs
      # nothing installed beyond the standard library and finishes in under a
      # second.
      - run: python scripts/check_tracked_clean.py
      # Everything below is expensive -- the suite under three hash seeds,
      # coverage, strict types, schema and documentation currency -- so it stays
      # filtered to the paths its steps read, and the job still reports success
      # so the required check does not hang.
      #
      # The list is hand-maintained and has been wrong. `corpus/**` was missing
      # while `format-semantics` loaded every document in it, so a change to
      # `corpus/accepted-documents.jsonl` reported green in eighteen seconds
      # without the one gate that reads it ever running. What a step opens
      # belongs here whether or not it is code: `format-semantics` reads
      # `corpus/`, and `docs-check` renders `CONTRIBUTING.md` from the makefile's
      # `gate` target and compares the result, so that file is a generated
      # artifact and an input, not prose.
      #
      # It cannot be made complete, and the design already accounts for that.
      # `tracked-clean` reads every tracked file, so every tracked file is an
      # input to `make check`; that is why the publishability gate is hoisted
      # above this filter and run unconditionally. `format-growth` reads the
      # release tags rather than any path, which is what `fetch-depth: 0` is for.
      # This filter covers the steps that do name their inputs.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: changes
        with:
          filters: |
            gated:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'scripts/**'
              - 'docs/**'
              - 'schema/**'
              - 'corpus/**'
              - 'pyproject.toml'
              - 'Makefile'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'denied-name-digests.txt'
              - '.github/workflows/**'
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
      # `.pre-commit-config.yaml` carries `check-yaml`, and nothing in CI ever
      # invoked pre-commit, so no job in this repository parsed a YAML file.
      # `publish.yml` is the file that makes that matter: it runs only on a
      # release, so a malformed one lands green and is met at the release
      # itself, with the tag already cut. The hook is run here rather than a
      # parser being added to the project's dependencies, because the hook is
      # already configured and its environment is pre-commit's problem.
      - if: steps.changes.outputs.yaml == 'true'
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run check-yaml --all-files
      # make check builds its own environment, so CI runs the same path as a
      # developer rather than a parallel one that can drift. It runs the
      # publishability gate a second time; that is a second of duplicated work,
      # and it keeps the developer-facing command complete.
      - if: steps.changes.outputs.gated == 'true'
        run: make check
      - if: steps.changes.outputs.gated != 'true'
        run: echo "No code, documentation, schema, or build file changed; the publishability gate above still ran over every tracked file."

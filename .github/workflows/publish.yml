name: Publish

# Build once, then publish via PyPI Trusted Publishing (OIDC) -- no API tokens.
# Cut a GitHub Release (tag vX.Y.Z) to publish to PyPI.
#
# One-time setup (see RELEASING.md):
#   - PyPI:   add a Trusted Publisher (project tiergraph, this repo, workflow
#             publish.yml, environment "pypi").
#   - GitHub: create environment "pypi" (Settings > Environments).

on:
  release:
    types: [published]

permissions:
  contents: read

# Every action below is pinned to a commit, with the release it was resolved
# from in the comment beside it. A tag and a branch are both repointable by
# whoever owns the action, and this workflow hands one of them an OIDC identity
# that can publish to PyPI under this project's name, so "whatever is at that
# ref when the job runs" is not an acceptable answer to which code executes.
# `pypa/gh-action-pypi-publish` was read from the `release/v1` branch; the pin
# below is the commit that branch pointed at, so today this changes nothing but
# who decides when it changes. The publishability gate refuses an unpinned or
# unallowlisted reference in either workflow, so the pins stay.
jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Verify version matches release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(PYTHONPATH=src python -c "import tiergraph; print(tiergraph.__version__)")
          echo "tiergraph.__version__=$VERSION release tag=$TAG"
          test "$VERSION" = "${TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tiergraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
